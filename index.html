<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartTipJar - Javad</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .subtitle {
      color: #a0aec0;
      margin-bottom: 30px;
      font-size: 15px;
      line-height: 1.5;
    }
    .tip-button {
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tip-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 114, 255, 0.4);
    }
    .wallet {
      margin-top: 25px;
      font-size: 13px;
      color: #718096;
      word-break: break-all;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 198, 255, 0.15);
      color: #00c6ff;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">NEAR Hackathon 2026</div>
    <h1>Javad</h1>
    <p class="subtitle">
      I'm a complete beginner learning Web3.<br>
      Building my first project at NEAR Hackathon with the help of AI.
    </p>
    
    <a class="tip-button" href="https://app.mynearwallet.com/send-money/javadr61.tg" target="_blank">
      Send Tip with NEAR
    </a>

    <div class="wallet">
      Wallet: javadr61.tg
    </div>
  </div>
</body>
</html>
